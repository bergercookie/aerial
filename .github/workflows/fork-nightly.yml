name: Fork Nightly

# Nightly signed prereleases for forks (nightly-<date>-<sha>, newest 5 kept). The upstream repository has its own
# nightly.yml, guarded to run only for its owner; this is the inverse so the
# two never both run. It does NOT use the F-Droid buildserver image, so the
# APK is not byte-reproducible (that only matters for F-Droid).
#
# Requires the AERIAL_KEYSTORE_BASE64, AERIAL_KEYSTORE_PASSWORD,
# AERIAL_KEY_ALIAS and AERIAL_KEY_PASSWORD repository secrets.
#
# Scheduled workflows are disabled on forks until you enable Actions in the
# fork's Actions tab. Use "Run workflow" to trigger a build manually.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-nightly
  cancel-in-progress: true

jobs:
  nightly:
    name: Build and publish nightly APK
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: github.repository_owner != 'shapeshed'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for commits in the last 24 hours
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] &&
             [ -z "$(git log --since='24 hours ago' -1)" ]; then
            echo "No commits in the last 24 hours; skipping nightly build."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25.0.4+101.0.LTS

      - name: Set up Gradle
        if: steps.check.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Make Gradle wrapper executable
        if: steps.check.outputs.skip != 'true'
        run: chmod +x ./gradlew

      - name: Decode release keystore
        if: steps.check.outputs.skip != 'true'
        env:
          AERIAL_KEYSTORE_BASE64: ${{ secrets.AERIAL_KEYSTORE_BASE64 }}
          AERIAL_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_KEYSTORE_PASSWORD }}
          AERIAL_KEY_ALIAS: ${{ secrets.AERIAL_KEY_ALIAS }}
          AERIAL_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
        run: |
          if [ -z "$AERIAL_KEYSTORE_BASE64" ] ||
             [ -z "$AERIAL_KEYSTORE_PASSWORD" ] ||
             [ -z "$AERIAL_KEY_ALIAS" ] ||
             [ -z "$AERIAL_KEY_PASSWORD" ]; then
            echo "All AERIAL_KEYSTORE_* signing secrets are required." >&2
            exit 1
          fi
          printf '%s' "$AERIAL_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aerial-release.jks"

      # The registry asset is generated by Gradle's generateRegistryAsset task
      # using the runner's python3.
      - name: Build signed release APK
        if: steps.check.outputs.skip != 'true'
        env:
          AERIAL_KEYSTORE_FILE: ${{ runner.temp }}/aerial-release.jks
          AERIAL_KEYSTORE_PASSWORD: ${{ secrets.AERIAL_KEYSTORE_PASSWORD }}
          AERIAL_KEY_ALIAS: ${{ secrets.AERIAL_KEY_ALIAS }}
          AERIAL_KEY_PASSWORD: ${{ secrets.AERIAL_KEY_PASSWORD }}
          AERIAL_BUILD_CHANNEL: nightly
        run: ./gradlew assembleRelease

      - name: Rename APK
        if: steps.check.outputs.skip != 'true'
        run: |
          set -eu
          apk="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Expected signed APK at $apk" >&2
            exit 1
          fi
          name="aerial-nightly-$(echo "${GITHUB_SHA}" | cut -c1-7).apk"
          mv "$apk" "./$name"
          sha256sum "./$name" > "./$name.sha256"
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      - name: Create nightly release
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          short_sha="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          tag="nightly-$(date -u +%Y-%m-%d)-${short_sha}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
          else
            gh release create "$tag" "./$APK_NAME" "./$APK_NAME.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Aerial Nightly $(date -u +%Y-%m-%d) (${short_sha})" \
              --notes "Automated nightly build @ ${GITHUB_SHA}, signed with this fork's release key so it installs as an update over the previous nightly. For testing only."
          fi

      - name: Prune old nightly releases
        if: steps.check.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: '5'
        run: |
          set -eu
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
            --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"nightly-\"))]
                  | sort_by(.createdAt) | reverse | .[$KEEP:] | .[].tagName" |
          while read -r old_tag; do
            echo "Deleting old nightly $old_tag"
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" -y --cleanup-tag
          done
